<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application received &mdash; Akanno &amp; Company Tax Services</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0e2439;
    --navy-deep:#081827;
    --navy-soft:#16395a;
    --gold:#c8a84b;
    --gold-bright:#e0bf62;
    --paper:#ffffff;
    --mist:#f4f6f9;
    --line:#dde3ea;
    --ink:#1c2834;
    --ink-soft:#5a6a7a;
    --maxw:1120px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:17px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;line-height:1.18;margin:0;letter-spacing:-.01em}
  a{color:inherit}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(14,36,57,.97);
    backdrop-filter:saturate(140%) blur(8px);
    border-bottom:1px solid rgba(200,168,75,.28);
  }
  .bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:70px}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0}
  .seal{
    width:38px;height:38px;flex:none;border-radius:50%;
    background:linear-gradient(145deg,var(--gold-bright),var(--gold));
    color:var(--navy-deep);
    display:grid;place-items:center;
    font-family:"Source Serif 4",serif;font-weight:700;font-size:17px;
  }
  .brand-text{min-width:0}
  .brand-name{color:#fff;font-weight:600;font-size:16.5px;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand-sub{color:var(--gold);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase}
  .nav-cta{
    flex:none;
    background:var(--gold);color:var(--navy-deep);
    font-weight:650;font-size:14.5px;
    padding:11px 20px;border-radius:4px;text-decoration:none;
    transition:background .18s ease;
  }
  .nav-cta:hover{background:var(--gold-bright)}

  /* ---------- hero ---------- */
  .hero{
    background:
      radial-gradient(1100px 520px at 78% -10%, rgba(200,168,75,.17), transparent 62%),
      linear-gradient(170deg,var(--navy) 0%, var(--navy-deep) 100%);
    color:#fff;
    padding:76px 0 68px;
  }
  .eyebrow{
    display:inline-block;
    color:var(--gold);
    font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    border:1px solid rgba(200,168,75,.45);
    border-radius:999px;padding:7px 16px;margin-bottom:26px;
  }
  .hero h1{font-size:clamp(2.1rem,5.4vw,3.5rem);font-weight:700;max-width:19ch}
  .hero p.lede{
    margin:22px 0 0;max-width:56ch;
    font-size:clamp(1.02rem,2.1vw,1.19rem);
    color:#ccd8e4;
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
  .btn{
    display:inline-block;text-decoration:none;font-weight:650;font-size:16px;
    padding:15px 30px;border-radius:5px;transition:transform .15s ease,background .18s ease;
  }
  .btn-primary{background:var(--gold);color:var(--navy-deep)}
  .btn-primary:hover{background:var(--gold-bright);transform:translateY(-1px)}
  .btn-ghost{border:1px solid rgba(255,255,255,.4);color:#fff}
  .btn-ghost:hover{border-color:var(--gold);color:var(--gold)}

  .facts{
    display:grid;gap:1px;background:rgba(255,255,255,.14);
    grid-template-columns:repeat(4,1fr);
    margin-top:54px;border-radius:6px;overflow:hidden;
  }
  .fact{background:rgba(8,24,39,.72);padding:20px 22px}
  .fact b{display:block;font-family:"Source Serif 4",serif;font-size:1.65rem;color:var(--gold);line-height:1.1}
  .fact span{display:block;margin-top:5px;font-size:13px;color:#b6c5d4;letter-spacing:.02em}

  /* ---------- sections ---------- */
  section{padding:74px 0}
  .alt{background:var(--mist);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .kicker{color:var(--gold);font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
  .kicker.on-light{color:#9a7f2c}
  h2{font-size:clamp(1.7rem,3.6vw,2.3rem);font-weight:700}
  .section-lede{margin:16px 0 0;max-width:62ch;color:var(--ink-soft);font-size:1.04rem}

  .cols{display:grid;grid-template-columns:1fr 1fr;gap:52px;margin-top:40px}
  .card{background:#fff;border:1px solid var(--line);border-radius:7px;padding:30px}
  .card h3{font-size:1.22rem;font-weight:600;margin-bottom:16px}
  ul.ticks{list-style:none;margin:0;padding:0}
  ul.ticks li{position:relative;padding-left:28px;margin-bottom:12px;color:var(--ink)}
  ul.ticks li:last-child{margin-bottom:0}
  ul.ticks li::before{
    content:"";position:absolute;left:4px;top:.62em;
    width:9px;height:9px;border-radius:2px;
    background:var(--gold);
  }

  /* ---------- the role table ---------- */
  .role-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:7px;overflow:hidden;margin-top:38px}
  .role-cell{background:#fff;padding:22px 24px}
  .role-cell dt{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:7px}
  .role-cell dd{margin:0;font-size:1.05rem;font-weight:500}
  .pay-flag{color:#9a7f2c;font-size:13.5px;font-weight:600}

  /* ---------- apply ---------- */
  #apply{background:linear-gradient(170deg,var(--navy) 0%,var(--navy-deep) 100%);color:#fff}
  #apply h2{color:#fff}
  #apply .section-lede{color:#ccd8e4}
  form{
    margin-top:38px;background:#fff;border-radius:8px;padding:34px;
    box-shadow:0 24px 60px rgba(0,0,0,.22);
  }
  .field{margin-bottom:20px}
  .field.row{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:0}
  label{display:block;font-size:14px;font-weight:600;color:var(--ink);margin-bottom:7px}
  .req{color:#a8323f}
  input,select,textarea{
    width:100%;font-family:inherit;font-size:16px;color:var(--ink);
    padding:13px 14px;border:1px solid #c5cedb;border-radius:5px;background:#fff;
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  textarea{min-height:110px;resize:vertical}
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--navy-soft);
    box-shadow:0 0 0 3px rgba(22,57,90,.13);
  }
  input[type=file]{padding:10px;background:var(--mist);cursor:pointer}
  .hint{font-size:13px;color:var(--ink-soft);margin-top:6px}
  button[type=submit]{
    width:100%;border:0;cursor:pointer;
    background:var(--gold);color:var(--navy-deep);
    font-family:inherit;font-weight:700;font-size:17px;
    padding:17px;border-radius:5px;margin-top:8px;
    transition:background .18s ease;
  }
  button[type=submit]:hover{background:var(--gold-bright)}
  button[type=submit][disabled]{opacity:.65;cursor:default}
  .form-note{font-size:13px;color:var(--ink-soft);text-align:center;margin:16px 0 0}
  .thanks{
    display:none;background:#fff;border-radius:8px;padding:56px 34px;margin-top:38px;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.22);
  }
  .thanks.show{display:block}
  .thanks .mark{
    width:58px;height:58px;margin:0 auto 20px;border-radius:50%;
    background:var(--gold);color:var(--navy-deep);
    display:grid;place-items:center;font-size:28px;font-weight:700;
  }
  .thanks h3{font-size:1.5rem;margin-bottom:12px}
  .thanks p{color:var(--ink-soft);margin:0 auto;max-width:44ch}
  .err{display:none;color:#a8323f;font-size:14.5px;font-weight:600;text-align:center;margin-top:14px}
  .err.show{display:block}

  /* ---------- footer ---------- */
  footer{background:var(--navy-deep);color:#9fb1c2;padding:56px 0 40px;font-size:15px}
  .foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:40px}
  footer h4{color:#fff;font-family:Inter,sans-serif;font-size:12.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;margin:0 0 14px}
  footer a{color:#cfdbe6;text-decoration:none}
  footer a:hover{color:var(--gold)}
  footer p{margin:0 0 9px}
  .clients-note{
    margin-top:42px;padding-top:26px;border-top:1px solid rgba(255,255,255,.12);
    display:flex;flex-wrap:wrap;gap:10px 22px;align-items:baseline;justify-content:space-between;
  }
  .clients-note span{font-size:14.5px}
  .copyright{margin-top:22px;font-size:13.5px;color:#75889a}

  @media (max-width:860px){
    .cols{grid-template-columns:1fr;gap:28px}
    .facts{grid-template-columns:1fr 1fr}
    .role-grid{grid-template-columns:1fr}
    .foot-grid{grid-template-columns:1fr;gap:30px}
    section{padding:56px 0}
    .hero{padding:56px 0 52px}
  }
  @media (max-width:560px){
    body{font-size:16px}
    .field.row{grid-template-columns:1fr;gap:0}
    .field.row .field{margin-bottom:20px}
    form{padding:24px 20px}
    .brand-sub{display:none}
    .nav-cta{padding:10px 15px;font-size:13.5px}
  }
</style>
<style>
  .confirm-wrap{
    min-height:100vh;
    display:grid;place-items:center;
    background:linear-gradient(170deg,var(--navy) 0%,var(--navy-deep) 100%);
    padding:40px 24px;
  }
  .confirm-card{
    background:#fff;border-radius:8px;padding:56px 44px;text-align:center;
    max-width:560px;box-shadow:0 24px 60px rgba(0,0,0,.22);
  }
  .confirm-card .mark{
    width:62px;height:62px;margin:0 auto 24px;border-radius:50%;
    background:var(--gold);color:var(--navy-deep);
    display:grid;place-items:center;font-size:30px;font-weight:700;
  }
  .confirm-card h1{font-size:1.75rem;margin-bottom:14px}
  .confirm-card p{color:var(--ink-soft);margin:0 auto 10px;max-width:46ch}
  .confirm-card .back{
    display:inline-block;margin-top:26px;text-decoration:none;font-weight:650;
    background:var(--navy);color:#fff;padding:14px 28px;border-radius:5px;
  }
  .confirm-card .back:hover{background:var(--navy-soft)}
  @media (max-width:560px){ .confirm-card{padding:40px 24px} }
</style>
</head>
<body>
  <div class="confirm-wrap">
    <div class="confirm-card">
      <div class="mark">&#10003;</div>
      <h1>Application received</h1>
      <p>Thank you for applying to Akanno &amp; Company Tax Services.</p>
      <p>We review applications as they arrive and will be in touch about next
         steps before the season begins on January 12.</p>
      <a class="back" href="./">Back to the job posting</a>
    </div>
  </div>
</body>
</html>
